<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a13">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RackUp · Pool &amp; Snooker Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1a13;--felt:#13241c;--card:#1a2f25;--card2:#223b2f;--line:#2c4a3b;
  --ink:#f3efe4;--ink2:#c3cdc6;--muted:#869a8f;
  --p0:#C4851A;--p1:#3E8FD6;
  --gold:#f2c94c;--bad:#e8695e;--good:#4cc38a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;text-shadow:0 1px 2px rgba(0,0,0,.35);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 72px) env(safe-area-inset-left);min-height:100vh;
  background:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;max-width:560px;margin:0 auto}
.logo{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1.5px;line-height:1}
.logo span{color:var(--gold)}
.sub{color:var(--muted);font-size:12px}
.card{background:rgba(14,30,22,.66);backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink2);font-weight:700}
.big{font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}
.d0{background:var(--p0)}.d1{background:var(--p1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.98)}

.fb{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.fbW{background:#1f6b45;color:#d8ffe9}.fbL{background:#6b2620;color:#ffd9d4}.fbD{background:#3a4a42;color:#e3ebe6}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.rate button{height:40px;border-radius:9px;background:var(--felt);border:1px solid var(--line);font-weight:800}
.rate button.on{background:var(--gold);color:#1b1608;border-color:var(--gold)}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
#bg svg{width:100%;height:100%}
.sbwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sb{position:relative;background:rgba(14,30,22,.82);border:1px solid var(--line);border-radius:18px;padding:14px 8px 10px;text-align:center;overflow:hidden;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:box-shadow .2s}
.sb::before{content:"";position:absolute;left:0;right:0;top:0;height:6px}
.sb.p0::before{background:var(--p0)}.sb.p1::before{background:var(--p1)}
.sb.at{box-shadow:0 0 0 3px var(--gold),0 0 24px rgba(242,201,76,.25)}
.sb .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .pts{font-family:'Bebas Neue',sans-serif;font-size:78px;line-height:.92;margin:6px 0 2px}
.sb .sbf{font-size:12px;color:var(--ink2)}
.sb .brk{margin-top:6px;font-size:13px;font-weight:800;color:var(--gold);min-height:18px}
.sb .tbl{font-size:11px;color:var(--muted);min-height:16px}
.sinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(10,22,16,.8);border:1px solid var(--line)}
.sinfo b{color:var(--ink)}
.sinfo .warn{color:#ffb4ab;font-weight:800}
.balls{display:flex;justify-content:space-between;gap:4px;margin:14px 2px 10px}
.ball{width:44px;height:44px;border-radius:50%;font-weight:800;color:#fff;font-size:16px;text-shadow:none;box-shadow:inset -4px -6px 10px rgba(0,0,0,.45),inset 3px 4px 6px rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.4)}
.ball:disabled{opacity:.2;box-shadow:none}
.ball:active{transform:scale(.9)}
.ball.lt{color:#111}
.ball.exp{outline:3px solid var(--gold);outline-offset:2px}
.sact{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sact .btn{padding:12px 6px;font-size:14px}
.foulrow{margin-top:8px;padding:10px;border-radius:12px;background:#3a1512;border:1px solid #6b2a24}
.foulrow .row{gap:6px}
.foulrow button.fv{flex:1;height:46px;border-radius:10px;background:#5a201b;border:1px solid #8a3a33;font-weight:800;font-size:18px}
.smini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.smini .pill{padding:7px 10px;font-size:12px}
.pill.on{background:var(--gold);color:#1b1608}
.paper{background:#f3ecdc;color:#1b1a17;border-radius:6px;padding:16px 16px 18px;margin:12px 0;text-shadow:none;box-shadow:0 10px 30px rgba(0,0,0,.45);
  background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:4px 4px;transform:rotate(-.4deg)}
.paper .mast{font-family:'UnifrakturMaguntia',serif;font-size:34px;text-align:center;line-height:1}
.paper .dateline{display:flex;justify-content:space-between;font:700 10px/1.2 Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;border-top:2px solid #1b1a17;border-bottom:1px solid #1b1a17;padding:4px 0;margin:6px 0 10px}
.paper .kick{display:inline-block;background:#c8102e;color:#fff;font:800 11px Inter,sans-serif;letter-spacing:1.5px;padding:3px 7px;text-transform:uppercase}
.paper .hl{font-family:Anton,Impact,sans-serif;font-size:44px;line-height:.98;text-transform:uppercase;margin:8px 0 6px;letter-spacing:.3px}
.paper .sub{color:#1b1a17;font:700 15px/1.3 Merriweather,Georgia,serif;margin-bottom:10px;border-bottom:1px solid #b9ad94;padding-bottom:10px}
.paper p{font:14px/1.55 Merriweather,Georgia,serif;margin:0 0 9px}
.paper p:first-of-type::first-letter{font-family:Anton,Impact,sans-serif;float:left;font-size:44px;line-height:.9;padding:4px 6px 0 0}
.paper .by{font:italic 12px Merriweather,Georgia,serif;color:#5a5446;margin-bottom:8px}
.paper .box{border:2px solid #1b1a17;padding:8px 10px;margin-top:10px;font:13px/1.45 Merriweather,Georgia,serif}
.paper .box b{font-family:Inter,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.paper .q{font-style:italic}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,26,19,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;max-width:190px;padding:10px 0 12px;font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px}
nav.tabs button.on{color:var(--gold)}

/* game switch */
.gsw{display:flex;background:rgba(15,32,24,.88);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.gsw button{flex:1;padding:10px;border-radius:10px;font-weight:700;letter-spacing:.5px;color:var(--ink2)}
.gsw button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.gsw button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* board */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:12px;align-items:stretch}
.pl{position:relative;background:linear-gradient(180deg,rgba(28,52,40,.78),rgba(14,30,22,.78));backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;text-align:center;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.pl::before{content:"";position:absolute;left:0;right:0;top:0;height:6px}
.pl.p0::before{background:var(--p0)}.pl.p1::before{background:var(--p1)}
.pl:active{transform:scale(.97)}
.pl .nm{font-weight:800;font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-family:'Bebas Neue',sans-serif;font-size:92px;line-height:.9;margin:6px 0 2px}
.pl .meta{font-size:12px;color:var(--ink2)}
.pl .fire{position:absolute;top:10px;right:8px;font-size:13px;font-weight:800;background:#3a1d0c;color:#ffb36b;border-radius:20px;padding:2px 7px}
.pl .tapme{font-size:11px;color:var(--muted);margin-top:6px}
.pl.leader{box-shadow:0 0 0 2px rgba(242,201,76,.35)}
.vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:12px;text-align:center;width:60px;background:rgba(10,22,16,.82);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:8px 0}
.vs .big{font-size:26px;color:var(--ink2)}
.board.decider .pl{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,105,94,.0)}50%{box-shadow:0 0 0 4px rgba(232,105,94,.55)}}
.decbar{margin-top:10px;text-align:center;background:#3a1512;border:1px solid #6b2a24;color:#ffb4ab;border-radius:12px;padding:8px;font-weight:800;letter-spacing:1px}
.wonbar{margin-top:10px;background:#123527;border:1px solid #2b6b4c;color:#9ff0c6;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* momentum */
.mom{position:relative;height:14px;border-radius:8px;background:var(--felt);border:1px solid var(--line);overflow:hidden}
.mom .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--muted);transform:translateX(-1px)}
.mom .fill{position:absolute;top:2px;bottom:2px;border-radius:5px;transition:all .5s cubic-bezier(.2,.9,.3,1.2)}

/* strip */
.strip{display:flex;flex-wrap:wrap;gap:10px 2px;align-items:flex-end}
.run{display:flex;flex-direction:column;align-items:center;margin-right:4px}
.run .lab{font-size:10px;font-weight:700;color:var(--ink2);white-space:nowrap;margin-bottom:3px;border-bottom:2px solid var(--muted);padding:0 2px 1px;width:100%;text-align:center}
.run .sq{display:flex;gap:2px}
.fr{width:22px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;position:relative}
.fr.w0{background:var(--p0)}.fr.w1{background:var(--p1)}
.fr i{position:absolute;top:-7px;right:-5px;font-style:normal;font-size:10px}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#0a140f;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink);min-width:150px;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .12s;z-index:5}
.tip b{display:block;margin-bottom:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend .dash{display:inline-block;width:18px;border-top:2px dashed var(--muted);vertical-align:middle;margin-right:6px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{padding:10px 12px;border-radius:12px;background:var(--felt);border:1px solid var(--line);font-size:14px;font-weight:600;text-align:left}
.chip small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.chip .pts{color:var(--gold);font-size:12px;margin-left:4px}
.chip.on{background:#3b3210;border-color:var(--gold)}
.chip.shame.on{background:#3b1714;border-color:var(--bad)}
.chip.shame .pts{color:var(--bad)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink2);font-weight:700}


/* toast */
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:60;pointer-events:none;text-align:center;transition:all .25s cubic-bezier(.2,1.4,.4,1);width:90%;max-width:420px}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .t1{font-family:'Bebas Neue',sans-serif;font-size:54px;line-height:.95;letter-spacing:1px;color:var(--gold);text-shadow:0 4px 0 #000,0 0 30px rgba(242,201,76,.5)}
#toast .t2{font-weight:700;font-size:15px;margin-top:8px;background:rgba(0,0,0,.75);display:inline-block;padding:6px 12px;border-radius:20px}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* stats */
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center}
.h2h .v{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1}
.h2h .v.r{text-align:right}
.h2h .k{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.split{grid-column:1/-1;display:flex;height:6px;gap:2px;margin:-2px 0 6px}
.split div{border-radius:3px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.li:first-child{border-top:0}
.li .r{text-align:right;font-weight:600}
.night{width:100%;text-align:left}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--ink2)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:20px;font-weight:700}
.step b{min-width:46px;text-align:center;font-size:15px}
.tog{width:52px;height:30px;border-radius:20px;background:var(--felt);border:1px solid var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.tog.on{background:#3b3210;border-color:var(--gold)}
.tog.on::after{left:25px;background:var(--gold)}
table.tv{width:100%;border-collapse:collapse;font-size:13px}
table.tv th,table.tv td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
table.tv th:first-child,table.tv td:first-child{text-align:left}
.shareimg{width:100%;border-radius:14px;border:1px solid var(--line)}
.crown{color:var(--gold)}
.center{text-align:center}
.mt{margin-top:10px}
</style>
</head>
<body>
<div id="bg"><svg viewBox="0 0 600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#1f6a45"/><stop offset=".7" stop-color="#14492f"/><stop offset="1" stop-color="#0c2e1e"/></radialGradient>
    <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#3a2212"/><stop offset=".5" stop-color="#5a3519"/><stop offset="1" stop-color="#3a2212"/></linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a13" stop-opacity=".35"/><stop offset=".5" stop-color="#0b1a13" stop-opacity=".15"/><stop offset="1" stop-color="#0b1a13" stop-opacity=".5"/></linearGradient>
    <clipPath id="bc"><circle r="15"/></clipPath>
  </defs>
  <rect width="600" height="1000" fill="#0b1a13"/>

  <g fill="#0f3d27"><rect x="62" y="52" width="476" height="14"/><rect x="62" y="934" width="476" height="14"/><rect x="62" y="52" width="14" height="896"/><rect x="524" y="52" width="14" height="896"/></g>
  <g fill="#050a07"><circle cx="66" cy="56" r="22"/><circle cx="534" cy="56" r="22"/><circle cx="66" cy="944" r="22"/><circle cx="534" cy="944" r="22"/><circle cx="56" cy="500" r="18"/><circle cx="544" cy="500" r="18"/></g>
  <g fill="#e8d6a8" opacity=".7">
    <circle cx="46" cy="164" r="4"/><circle cx="46" cy="276" r="4"/><circle cx="46" cy="388" r="4"/><circle cx="46" cy="612" r="4"/><circle cx="46" cy="724" r="4"/><circle cx="46" cy="836" r="4"/>
    <circle cx="554" cy="164" r="4"/><circle cx="554" cy="276" r="4"/><circle cx="554" cy="388" r="4"/><circle cx="554" cy="612" r="4"/><circle cx="554" cy="724" r="4"/><circle cx="554" cy="836" r="4"/>
    <circle cx="181" cy="36" r="4"/><circle cx="300" cy="36" r="4"/><circle cx="419" cy="36" r="4"/><circle cx="181" cy="964" r="4"/><circle cx="300" cy="964" r="4"/><circle cx="419" cy="964" r="4"/>
  </g>
  <line x1="62" y1="724" x2="538" y2="724" stroke="#9fd3b6" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="300" cy="276" r="3" fill="#9fd3b6" opacity=".3"/>
  <g id="balls" opacity=".75"></g>
  <rect width="600" height="1000" fill="url(#fade)"/>
</svg></div>
<header class="top">
  <div>
    <div class="logo">RACK<span>UP</span></div>
    <div class="sub" id="hdrsub">Pool &amp; snooker scorecard</div>
  </div>
  <div class="pill" id="hdrpill"></div>
</header>
<main class="wrap" id="view"></main>
<nav class="tabs">
  <button data-act="tab" data-t="night"><span class="ic">🎱</span>Tonight</button>
  <button data-act="tab" data-t="rival"><span class="ic">🏆</span>Rivalry</button>
  <button data-act="tab" data-t="set"><span class="ic">⚙️</span>Settings</button>
</nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"><div class="t1"></div><div class="t2"></div></div>

function setSync(st){
  CLOUD.status=st;
  const t={local:'Pool & snooker scorecard', connecting:'Connecting…', synced:'☁️ Synced', pending:'⏳ Saved on phone · syncing', offline:'📴 No signal · saved on phone', error:'⚠️ Sync problem · saved on phone'}[st]||'';
  const el=document.getElementById('hdrsub'); if(el) el.textContent=t;
}
function cloudPush(){
  if(!CLOUD.user || !CLOUD.ref) return;
  const js=JSON.stringify(S); if(js===CLOUD.lastJSON) return;
  CLOUD.lastJSON=js;
  setSync(navigator.onLine?'pending':'offline');
  CLOUD.fs.setDoc(CLOUD.ref,{data:js, updated:CLOUD.fs.serverTimestamp(), by:CLOUD.user.email||''})
    .then(()=>{ if(CLOUD.status!=='error') setSync('synced'); })
    .catch(e=>{ console.warn(e); setSync('error'); });
}
function onRemote(snap){
  const pend=snap.metadata.hasPendingWrites, cache=snap.metadata.fromCache;
  setSync(pend ? (navigator.onLine?'pending':'offline') : (cache ? (navigator.onLine?'connecting':'offline') : 'synced'));
  if(!snap.exists()){ if(!cache){ CLOUD.lastJSON=null; cloudPush(); } return; }
  const js=snap.data().data;
  if(!js || pend || js===CLOUD.lastJSON) return;
  try{
    const prevAt=S.last&&S.last.at;
    CLOUD.lastJSON=js; S=JSON.parse(js); migrate();
    const l=S.last; if(l && l.at!==prevAt && CLOUD.user && (l.email||'')!==(CLOUD.user.email||'') && Date.now()-l.at<120000) snack(`🔄 <b>${esc(whoName(l))}</b> ${esc(l.what)} · ${clock(l.at)}`);
    try{ localStorage.setItem(KEY, js); }catch(e){}
    if(!document.getElementById('ov').classList.contains('show')){ UI.setup=null; render(); }
  }catch(e){ console.warn(e); }
}
async function cloudInit(){
  if(!FIREBASE_CONFIG) return;
  CLOUD.on=true; setSync('connecting');
  const fail=()=>{ if(!CLOUD.ready){ CLOUD.on=false; CLOUD.ready=true; setSync('offline'); render(); } };
  const to=setTimeout(fail,8000);
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG);
    let db; try{ db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }catch(e){ db=F.getFirestore(app); }
    const auth=Au.getAuth(app);
    CLOUD.fs=F; CLOUD.db=db; CLOUD.ref=F.doc(db,'rackup','main');
    CLOUD.signIn=(e,p)=>Au.signInWithEmailAndPassword(auth,e,p);
    CLOUD.signOut=()=>Au.signOut(auth);
    Au.onAuthStateChanged(auth,u=>{
      clearTimeout(to);
      CLOUD.on=true; CLOUD.ready=true; CLOUD.user=u;
      if(CLOUD.unsub){ CLOUD.unsub(); CLOUD.unsub=null; }
      if(u) CLOUD.unsub=F.onSnapshot(CLOUD.ref,{includeMetadataChanges:true},onRemote,e=>{console.warn(e); setSync('error');});
      else setSync('local');
      render();
    });
  }catch(e){ console.warn(e); clearTimeout(to); fail(); }
}

/* ---------------- maths ---------------- */
function calc(n, upto){
  upto = upto==null ? n.frames.length : upto;
  const sc={}, won={}, minD={};
  GAMES.forEach(g=>{ sc[g]=n.games[g]?[...n.games[g].start]:[0,0]; won[g]=[0,0]; minD[g]=[0,0]; });
  const hb=[0,0]; const sn={pts:[0,0], brk:[[],[]], fouls:[0,0], scored:0};
  const fw=[0,0], pts=[0,0], best=[0,0];
  let run={p:-1,len:0};
  const lead=[0];
  const glory=[{},{}], shame=[{},{}];
  for(let i=0;i<upto;i++){
    const f=n.frames[i], w=f.w, l=1-w;
    sc[f.g][w]++; won[f.g][w]++; fw[w]++;
    let base=1; (f.gl||[]).forEach(k=>{const d=gdef(f.g,k); if(d){base+=d.p; glory[w][k]=(glory[w][k]||0)+1;}});
    pts[w]+=base*(f.ch?2:1);
    (f.sh||[]).forEach(k=>{const d=sdef(f.g,k); if(d){pts[l]-=d.p; shame[l][k]=(shame[l][k]||0)+1;}});
    if((f.gl||[]).includes('ww')) shame[l].wwd=(shame[l].wwd||0)+1;
    if(f.pts){ sn.scored++; sn.pts[0]+=f.pts[0]; sn.pts[1]+=f.pts[1]; (f.brk||[]).forEach(b=>sn.brk[b[0]].push(b[1])); if(f.fouls){sn.fouls[0]+=f.fouls[0]; sn.fouls[1]+=f.fouls[1];} }
    if(f.hb){ hb[0]=Math.max(hb[0],f.hb[0]||0); hb[1]=Math.max(hb[1],f.hb[1]||0); }
    if(run.p===w) run.len++; else run={p:w,len:1};
    best[w]=Math.max(best[w],run.len);
    lead.push(fw[0]-fw[1]);
    const d=sc[f.g][0]-sc[f.g][1];
    minD[f.g][0]=Math.min(minD[f.g][0],d); minD[f.g][1]=Math.min(minD[f.g][1],-d);
  }
  const tot=[0,0]; GAMES.forEach(g=>{tot[0]+=sc[g][0]; tot[1]+=sc[g][1];});
  return {sc,won,fw,pts,best,run,lead,minD,glory,shame,tot,hb,sn};
}
function nightWinner(c){
  if(c.tot[0]!==c.tot[1]) return c.tot[0]>c.tot[1]?0:1;
  if(c.pts[0]!==c.pts[1]) return c.pts[0]>c.pts[1]?0:1;
  return -1;
}
function momentum(n){
  const fr=n.frames.slice(-6); let s=0,t=0;
  fr.forEach((f,i)=>{const wt=i+1; t+=wt; s+= (f.w===0?1:-1)*wt;});
  return t? s/21 : 0; // normalised to a full 6-frame window
}

/* ---------------- fx ---------------- */
let AC=null;
function beep(kind){
  if(!S.set.fx) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const seq = kind==='big' ? [523,659,784,1046] : kind==='bad' ? [300,220] : [660];
    seq.forEach((fq,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type= kind==='bad'?'sawtooth':'triangle'; o.frequency.value=fq;
      const t=AC.currentTime+i*0.09;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.25);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(kind==='big'?[40,40,80]:30); }catch(e){}
}
const TQ=[]; let tBusy=false;
function toast(t1,t2,kind){ TQ.push({t1,t2,kind}); if(!tBusy) nextToast(); }
function nextToast(){
  const x=TQ.shift(); if(!x){tBusy=false;return;} tBusy=true;
  const el=document.getElementById('toast');
  el.querySelector('.t1').textContent=x.t1;
  const t2=el.querySelector('.t2'); t2.textContent=x.t2||''; t2.style.display=x.t2?'inline-block':'none';
  el.querySelector('.t1').style.color = x.kind==='bad' ? 'var(--bad)' : 'var(--gold)';
  el.classList.add('show'); beep(x.kind||'big');
  if(x.kind!=='bad' && S.set.fx) confetti();
  setTimeout(()=>{el.classList.remove('show'); setTimeout(nextToast,260);},1700);
}
function confetti(){
  const cols=['#f2c94c','#C4851A','#3E8FD6','#4cc38a','#f3efe4'];
  for(let i=0;i<28;i++){
    const s=document.createElement('span'); s.className='conf';
    s.style.left=Math.random()*100+'vw'; s.style.background=cols[i%cols.length];
    s.style.animationDuration=(1.4+Math.random()*1.4)+'s'; s.style.animationDelay=(Math.random()*0.3)+'s';
    s.style.borderRadius = i%3?'2px':'50%';
    document.body.appendChild(s); setTimeout(()=>s.remove(),3200);
  }
}

function logFrame(){
  const n=S.cur, sel=UI.sel, w=sel.w, l=1-w, g=n.g;
  const bo = g==='s' ? (sel.snk?sel.snk.first:(n.snk?n.snk.first:nextBreaker(n,g))) : nextBreaker(n,g);
  if(n.bov) delete n.bov[g];
  const before=calc(n);
  const f={g, w, gl:[...sel.gl], sh:[...sel.sh], t:Date.now(), ev:[], bo};
  if(CLOUD.user) f.by=meIdx();
  UI.what=`logged frame ${n.frames.length+1}: ${S.names[w]} won the ${GL(g).toLowerCase()}`;
  if(sel.snk){ f.pts=sel.snk.pts; f.brk=sel.snk.brk; f.first=sel.snk.first; f.fouls=sel.snk.fouls; if(sel.snk.hb[0]||sel.snk.hb[1]) f.hb=sel.snk.hb; }
  else if(g==='s'){ if(n.snk) f.first=n.snk.first; const a=+(document.getElementById('hb0')||{}).value||0, b=+(document.getElementById('hb1')||{}).value||0; if(a||b) f.hb=[Math.min(147,a),Math.min(147,b)]; }
  n.frames.push(f);
  const after=calc(n);
  const T=[];
  // glory moments
  f.gl.forEach(k=>{const d=gdef(g,k); if(d&&d.big){ T.push([d.big, S.names[w]]); f.ev.push(k); }});
  // streaks
  if(after.run.len===3){ T.push(['ON FIRE 🔥', `${S.names[w]} · 3 on the bounce`]); f.ev.push('fire3'); }
  else if(after.run.len===5){ T.push(['UNSTOPPABLE', `${S.names[w]} · 5 on the bounce`]); f.ev.push('fire5'); }
  else if(after.run.len>5){ T.push([`${after.run.len} IN A ROW`, S.names[w]]); f.ev.push('fireN'); }
  if(before.run.p===l && before.run.len>=3){ T.push(['STREAK OVER', `${S.names[w]} ends ${S.names[l]}'s run of ${before.run.len}`]); f.ev.push('break'); }
  // comeback
  if(before.minD[g][w]<=-3 && after.sc[g][w]===after.sc[g][l]){ T.push(['COMEBACK!', `${S.names[w]} was ${-before.minD[g][w]} down, now level`]); f.ev.push('comeback'); }
  // race
  const race=n.games[g].race;
  if(race>0){
    if(after.sc[g][w]===race && before.sc[g][w]<race){ T.push([`${GL(g).toUpperCase()} TO ${S.names[w].toUpperCase()}`, `Won the race to ${race}`]); f.ev.push('race'); }
    else if(after.sc[g][0]===race-1 && after.sc[g][1]===race-1){ T.push(['HILL-HILL', 'Decider. Next frame takes it']); f.ev.push('hill'); }
  }
  if(f.sh.length && !T.length){ T.push(['OUCH', `${S.names[l]} · ${f.sh.map(k=>sdef(g,k).l).join(', ')}`,'bad']); }
  if(g==='s') n.snk=null;
  closeSheet(); save(); render();
  if(T.length) T.forEach(t=>toast(t[0],t[1],t[2])); else beep('tick');
}

function endNight(){
  const n=S.cur;
  if(!n.frames.length){ S.cur=null; save(); render(); return; }
  const c=calc(n), w=nightWinner(c);
  n.ended=true; n.result={tot:c.tot, pts:c.pts, win:w};
  UI.what=`ended the night (${c.tot[0]}–${c.tot[1]})`;
  if(w>=0) S.owed[1-w]++;
  S.nights.push(n); S.cur=null;
  try{ n.paper=report(n); }catch(e){}
  save();
  UI.tab='rival'; UI.view=n.id; UI.cmp=null; render();
  if(w>=0) toast(`${S.names[w].toUpperCase()} WINS THE NIGHT`, `${S.names[1-w]} owes a round 🍺`);

}

  let base=1; sel.gl.forEach(k=>base+=gdef(g,k).p); const mult=1;
  document.getElementById('sheet').innerHTML=`
    <div class="row between"><h2>🏆 ${N(w)} takes the frame</h2><span class="pill">${GL(g).toUpperCase()}</span></div>
    <div class="muted" style="font-size:13px">Frame ${n.frames.length+1}</div>

/* ---------------- live snooker scoring ---------------- */
const BALLS=[null,{n:'Red',c:'#c8102e'},{n:'Yellow',c:'#f2c21b',lt:1},{n:'Green',c:'#13854a'},{n:'Brown',c:'#6b3e1f'},{n:'Blue',c:'#1f4fbf'},{n:'Pink',c:'#f29ab9',lt:1},{n:'Black',c:'#111'}];
const colRem=k=>{let t=0; for(let v=k+2; v<=7; v++) t+=v; return t;};
function nextBreaker(n,g){
  if(n.bov && n.bov[g]!=null) return n.bov[g];
  const fr=n.frames.filter(f=>f.g===g && f.bo!=null);
  if(!fr.length) return n.first||0;
  const l=fr[fr.length-1];
  if(g!=='s' && n.rule && n.rule[g]==='win') return l.w;
  return 1-l.bo;
}
function breakLine(n,g){
  const b=nextBreaker(n,g), rule = g==='s'||!n.rule||n.rule[g]!=='win' ? 'alternate breaks' : 'winner breaks';
  return `<div class="sinfo" style="align-items:center"><span>🎱 Break: <b>${N(b)}</b> <span class="muted">· ${rule}</span></span><button class="pill" data-act="swapbo" data-g="${g}">⇄ Swap</button></div>`;
}
function snkInit(n){
  if(n.snk) return n.snk;
  n.snk={first: nextBreaker(n,'s'), reds:S.set.reds||15, shots:[]};
  return n.snk;
}
function snkState(sn){
  const st={sc:[0,0], turn:sn.first, brk:0, reds:sn.reds, on:false, clr:0, breaks:[], need:[false,false], fouls:[0,0], foulPts:[0,0]};
  const endBreak=()=>{ if(st.brk>0) st.breaks.push([st.turn,st.brk]); st.brk=0; };
  const rem=()=>st.reds*8 + (st.on?7:0) + colRem(st.clr);
  sn.shots.forEach(s=>{
    if(s.t==='pot'){
      const v=s.b;
      if(v===1){ st.reds=Math.max(0,st.reds-1); st.on=true; }
      else if(st.on){ st.on=false; }
      else if(st.reds===0){ st.clr=Math.max(st.clr, v-1); }
      st.sc[st.turn]+=v; st.brk+=v;
    } else if(s.t==='free'){
      const v = st.reds>0 && !st.on ? 1 : (st.on?0:st.clr+2);
      st.sc[st.turn]+=v; st.brk+=v; if(st.reds>0) st.on=true;
    } else if(s.t==='miss'){ endBreak(); st.on=false; st.turn=1-st.turn; }
    else if(s.t==='foul'){ endBreak(); st.on=false; st.sc[1-st.turn]+=s.v; st.fouls[st.turn]++; st.foulPts[1-st.turn]+=s.v; st.turn=1-st.turn; }
    else if(s.t==='back'){ st.turn=1-st.turn; }
    else if(s.t==='redoff'){ st.reds=Math.max(0,st.reds-1); }
    else if(s.t==='respot'){ endBreak(); st.clr=5; st.on=false; }
    const r=rem();
    [0,1].forEach(p=>{ if(st.sc[1-p]-st.sc[p] > r) st.need[p]=true; });
  });
  st.rem=rem();
  st.exp = st.clr>=6 ? 'done' : st.on ? 'colour' : st.reds>0 ? 'red' : st.clr+2;
  st.allBreaks = st.brk>0 ? [...st.breaks,[st.turn,st.brk]] : [...st.breaks];
  st.top=[0,1].map(p=>Math.max(0,...st.allBreaks.filter(b=>b[0]===p).map(b=>b[1])));
  return st;
}
function snkShot(shot){
  const n=S.cur, sn=snkInit(n);
  sn.shots.push(shot); UI.foul=false;
  { const st0=snkState(sn); UI.what = shot.t==='pot'?`potted the ${BALLS[shot.b].n.toLowerCase()} (${st0.sc[0]}–${st0.sc[1]})` : shot.t==='foul'?`marked a foul (${shot.v} away)` : `updated the snooker score (${st0.sc[0]}–${st0.sc[1]})`; }
  save();
  const st=snkState(sn);
  if(shot.t==='pot'){ beep('tick');
    if(st.brk>=100 && st.brk-shot.b<100) toast('CENTURY!', `${S.names[st.turn]} · ${st.brk} and counting`);
    else if(st.brk>=50 && st.brk-shot.b<50) toast('50 BREAK', S.names[st.turn]);
  }
  if(shot.t==='foul') beep('bad');
  render();
}
function snkOver(){
  const n=S.cur, sn=snkInit(n), st=snkState(sn);
  if(st.sc[0]===st.sc[1]){
    if(st.exp==='done'){ sn.shots.push({t:'respot'}); save(); render(); toast('RE-SPOTTED BLACK','Scores level. Black goes back on'); }
    else toast('ALL SQUARE','Can\'t end a frame on level scores','bad');
    return;
  }
  const w = st.sc[0]>st.sc[1]?0:1, top=st.top[w], gl=new Set();
  if(top>=100) gl.add('c100'); else if(top>=50) gl.add('b50'); else if(top>=30) gl.add('b30'); else if(top>=20) gl.add('b20');
  if(st.exp==='done' && Math.abs(st.sc[0]-st.sc[1])<=7) gl.add('otb');
  if(st.need[w]) gl.add('snk');
  document.getElementById('sheet').innerHTML='';
  UI.sel={w, gl, sh:new Set(), snk:{pts:[...st.sc], brk:st.allBreaks, hb:st.top, first:sn.first, fouls:st.fouls}};
  drawAward(); document.getElementById('ov').classList.add('show');
}
function snookerBoard(n,c){

  <div class="balls">${[1,2,3,4,5,6,7].map(b=>`<button class="ball ${BALLS[b].lt?'lt':''} ${isExp(b)&&can(b)?'exp':''}" style="background:${BALLS[b].c}" data-act="pot" data-b="${b}" ${can(b)?'':'disabled'} aria-label="${BALLS[b].n}">${b}</button>`).join('')}</div>
  <div class="sact">
    <button class="btn" data-act="smiss" ${st.exp==='done'?'disabled':''}>↔ Miss / safe</button>

  </div>
  ${UI.foul?`<div class="foulrow"><div style="font-size:13px;margin-bottom:8px">Foul by <b>${N(t)}</b>. <b>${N(1-t)}</b> gets:</div>
    <div class="row">${[4,5,6,7].map(v=>`<button class="fv" data-act="sfv" data-v="${v}">${v}</button>`).join('')}<button class="btn" data-act="sfoul" style="padding:10px">✕</button></div></div>`:''}
  <div class="smini">
    ${last&&last.t==='foul'?`<button class="pill" data-act="sback">↩ Put ${N(1-t)} back in</button>`:''}
    ${st.exp!=='done'&&!st.on?`<button class="pill" data-act="sfree">Free ball</button>`:''}
    ${st.reds>0&&started?`<button class="pill" data-act="sredoff">− Red (went in on a foul)</button>`:''}

  </div>

/* ---------- odds: recent frames across all games, recency-weighted ---------- */
const FRAC=[[1,10],[1,8],[1,6],[1,5],[2,9],[1,4],[2,7],[1,3],[4,11],[2,5],[4,9],[1,2],[8,15],[4,7],[8,13],[4,6],[8,11],[4,5],[5,6],[10,11],[1,1],[11,10],[6,5],[5,4],[11,8],[6,4],[13,8],[7,4],[15,8],[2,1],[9,4],[5,2],[11,4],[3,1],[7,2],[4,1],[9,2],[5,1],[6,1],[7,1],[8,1],[10,1]];
function frac(p){
  if(p>0.488 && p<0.512) return 'Evens';
  const r=(1-p)/p; let best=FRAC[0], d=1e9;
  FRAC.forEach(f=>{ const x=Math.abs(Math.log(f[0]/f[1])-Math.log(r)); if(x<d){d=x;best=f;} });
  return best[0]===best[1]?'Evens':`${best[0]}/${best[1]}`;
}
function oddsFrom(nights){
  const recent=nights.slice(-10), L=recent.length, PRIOR=3;
  const gw={}; GAMES.forEach(g=>gw[g]={a:0,b:0});
  recent.forEach((n,i)=>{ const wt=Math.pow(0.75,L-1-i), c=calc(n);
    GAMES.forEach(g=>{ gw[g].a+=c.won[g][0]*wt; gw[g].b+=c.won[g][1]*wt; }); });
  const per={}; let num=0, den=0;
  GAMES.forEach(g=>{ const t=gw[g].a+gw[g].b; per[g]=(gw[g].a+PRIOR)/(t+2*PRIOR); if(t){ num+=per[g]*t; den+=t; } });
  return {p: den? num/den : 0.5, per, played:GAMES.filter(g=>gw[g].a+gw[g].b>0)};
}
function oddsCard(compact, list){
  list=list||S.nights;
  const o=oddsFrom(list), prev=list.length?oddsFrom(list.slice(0,-1)):null;
  const move=i=>{ if(!prev) return ''; const now=i?1-o.p:o.p, was=i?1-prev.p:prev.p; if(Math.abs(now-was)<0.01) return '<span class="muted">steady</span>';
    return now>was?`<span style="color:var(--good)">▲ in from ${frac(was)}</span>`:`<span style="color:var(--bad)">▼ out from ${frac(was)}</span>`; };
  const side=i=>`<div class="center grow"><div style="font-weight:700"><span class="dot d${i}"></span>${N(i)}</div><div class="big" style="font-size:40px;line-height:1.05">${frac(i?1-o.p:o.p)}</div><div style="font-size:11px">${move(i)}</div><div class="muted" style="font-size:11px">${Math.round((i?1-o.p:o.p)*100)}% chance</div></div>`;
  return `<div class="card">
    <div class="row between"><h3 style="margin:0">📈 The odds</h3><span class="muted" style="font-size:11px">${list.length?`from the last ${Math.min(10,list.length)} night${list.length>1?'s':''}`:'first night: evens'}</span></div>
    <div class="row mt" style="margin-top:12px">${side(0)}<div class="muted big" style="font-size:22px">v</div>${side(1)}</div>
    ${o.played.length?`<div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center">${o.played.map(g=>`<span class="pill">${GL(g)}: ${N(o.per[g]>=0.5?0:1)} ${frac(Math.max(o.per[g],1-o.per[g]))}</span>`).join('')}</div>`:''}
  </div>`;
}

function avgRate(p,k){

function timeLeft(G){ return G.t0 && G.mins ? G.t0 + (G.mins+(G.extra||0))*60000 - Date.now() : null; }

function rng(seed){ let h=2166136261; for(const ch of String(seed)) h=Math.imul(h^ch.charCodeAt(0),16777619); return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function report(n){

  const nm=i=>S.names[i], NM=i=>S.names[i].toUpperCase();
  const hi=Math.max(...c.tot), lo=Math.min(...c.tot), margin=hi-lo;
  const venue=n.venue||'the club', VEN=(n.venue||'the club').toUpperCase();
  const day=new Date(n.date).toLocaleDateString('en-GB',{weekday:'long'});
  const gl=gamesOf(n).filter(g=>c.won[g][0]+c.won[g][1]>0);
  const onlySnk = gl.length===1 && gl[0]==='s';
  const sport = onlySnk ? 'snooker' : gl.every(g=>g!=='s') ? 'pool' : 'pool and snooker';
  const L = w>=0 ? 1-w : -1;
  // facts
  const first=n.frames[0];
  const worst=[0,1].map(p=>Math.min(0,...c.lead.map(v=>p===0?v:-v)));   // biggest deficit each player faced
  const comeback = w>=0 && worst[w]<=-2 ? -worst[w] : 0;

  const shame=[]; n.frames.forEach((f,i)=>(f.sh||[]).forEach(k=>shame.push({k,p:1-f.w,i:i+1,g:f.g})));
  const has=(k,p)=>glory.filter(x=>x.k===k&&(p==null||x.p===p));

  const upto=S.nights.slice(0,idx+1), tally=[0,0]; upto.forEach(x=>{ if(x.result&&x.result.win>=0) tally[x.result.win]++; });
  const dur=gamesOf(n).reduce((a,g)=>a+((n.games[g].t1&&n.games[g].t0)?n.games[g].t1-n.games[g].t0:0),0);
  const r=n.rate||[0,0];
  const run=c.best[0]>=c.best[1]?0:1;

  // headline: biggest story wins
  let kick=sport.toUpperCase(), hl, sub;
  if(w<0){ hl=pick([`HONOURS EVEN AT ${VEN}`,'STALEMATE!','NOTHING TO SPLIT THEM']); sub=`${nm(0)} and ${nm(1)} share the spoils ${c.tot[0]}–${c.tot[1]} and nobody buys the round`; }

    else if(has('gb',w).length){ hl=pick([`GOLDEN ${W}`,`${W} STRIKES GOLD`,`${W}'S GOLDEN TOUCH`]); kick='GOLDEN BREAK'; }
    else if(comeback>=3){ hl=pick([`THE GREAT ESCAPE`,`${W} RISES FROM THE DEAD`,`LAZARUS ${W}`]); kick='COMEBACK'; }
    else if(lo===0 && hi>=3){ hl=pick([`${Lx} WHITEWASHED`,`NIL BY MOUTH FOR ${Lx}`,`${W} SHUTS OUT ${Lx}`]); kick='WHITEWASH'; }
    else if(prior.length>=2 && pW<0.42){ hl=pick([`SHOCK! ${W} STUNS ${Lx}`,`BOOKIES BURNED AS ${W} WINS`,`UNDERDOG ${W} BITES BACK`]); kick='SHOCK'; }
    else if(decider){ hl=pick([`${W} HOLDS NERVE IN DECIDER`,`HILL-HILL HEARTBREAK FOR ${Lx}`]); kick='DECIDER'; }
    else if(has('snk',w).length){ hl=pick([`SNOOKERED? NOT ${W}`,`${W} DIGS DEEP`]); kick='DRAMA'; }
    else if(comeback>=2){ hl=pick([`${W} FIGHTS BACK`,`COMEBACK KID ${W}`]); kick='COMEBACK'; }

    else if(margin===1){ hl=pick([`${W} BY A WHISKER`,`PHOTO FINISH!`,`${W} EDGES IT`]); }
    else if(streak>=3){ hl=pick([`${W} MAKES IT ${streak} IN A ROW`,`UNSTOPPABLE ${W}`]); kick='WIN STREAK'; }
    else hl=pick([`${W} DOES THE BUSINESS`,`${W} RACKS UP ANOTHER`,`${W} CUES UP A WIN`,`${W} POTS THE SPOILS`]);
    sub=pick([`${nm(L)} left counting the cost after ${hi}–${lo} defeat at ${venue}, and he's buying the drinks`,

  const monName=new Date(n.date).toLocaleDateString('en-GB',{month:'long'});
  const P=[];

  // ---------- 1: the result ----------
  const verb = w<0?'drew with' : margin>=5?pick(['thrashed','demolished','hammered','took apart']) : margin>=3?pick(['saw off','comfortably beat','got the better of']) : pick(['edged','pipped','narrowly beat','just got past']);
  let p1 = w<0 ? `${nm(0)} and ${nm(1)} could not be separated at ${venue} on ${day} night, finishing all square at ${c.tot[0]}–${c.tot[1]}.`
               : `${nm(w)} ${verb} ${nm(L)} ${hi}–${lo} at ${venue} on ${day} night.`;
  if(w>=0 && prior.length>=2){ p1 += pW<0.42 ? ` He went into it as a ${frac(pW)} outsider, so this was one for the punters who like a long shot.` : pW>0.6 ? ` Priced at ${frac(pW)} beforehand, he was the bookies' favourite and duly delivered.` : ` The odds had it close to a coin toss beforehand.`; }
  if(dur>30*60000) p1 += ` In all, the pair spent ${fmtDur(dur)} at the table and played ${n.frames.length} frames.`;
  P.push(p1);

  // ---------- 2: how it started ----------
  let p2='';

        t = i===0 ? `${nm(L)} had the better of the ${G}, winning it ${R2.hi}–${R2.lo}` : `${nm(L)} took the ${G} ${R2.hi}–${R2.lo}`;
      } else {
        const ww=R2.gw, other=gl.filter(x=>x!==g).map(res).some(o=>o.gw===1-ww);
        if(other && gl.indexOf(g)>0) t = `${nm(ww)} ${pick(['recovered well to make amends for','bounced back from','put right'])} a ${pick(['poor','disappointing','sloppy'])} ${GL(gl.find(x=>res(x).gw===1-ww)).toLowerCase()} display, ${R2.m>=3?'running away with':'taking'} the ${G} ${R2.hi}–${R2.lo}`;
        else t = R2.m>=4 ? `${nm(ww)} was dominant in the ${G}, winning it ${R2.hi}–${R2.lo}` : R2.m===1 ? `The ${G} was tight, ${nm(ww)} squeezing it ${R2.hi}–${R2.lo}` : `${nm(ww)} took the ${G} ${R2.hi}–${R2.lo}`;
      }
      // colour
      const extras=[];
      if(fr.length && R2.gw>=0 && fr[0].w!==R2.gw) extras.push(`despite losing the opening frame`);
      let br=0,bp=-1,cur=0,cp=-1; fr.forEach(f=>{ if(f.w===cp) cur++; else {cp=f.w;cur=1;} if(cur>br){br=cur;bp=cp;} });
      if(br>=3) extras.push(`${bp===R2.gw?'helped by':'even with'} ${bp===R2.gw?'a':`${nm(bp)}'s`} run of ${br} straight frames`);
      if(GG.t0 && GG.t1 && fr.length>=3){ const per=(GG.t1-GG.t0)/fr.length/60000; if(per>=2) extras.push(per<8?`with frames flying by at one every ${Math.round(per)} minutes`:per>20?`in a long, cagey session averaging ${Math.round(per)} minutes a frame`:''); }

      const ex=extras.filter(Boolean).slice(0,2);
      return t + (ex.length?`, ${ex.join(', ')}`:'') + '.';
    };
    let p3=gl.map(gameLine).join(' ');
    if(w>=0 && gl.length>1 && gl.some(g=>res(g).gw===L) && gl.some(g=>res(g).gw===w)) p3 += ` ${pick([`Honours split on the games, then, but the frame count is what matters.`,`A night of two halves.`,`One each on the games, but ${nm(w)} won more frames overall.`])}`;

    if(streak>=2) p8+=`That's ${streak} nights on the bounce for ${nm(w)}. `;
    if(brokeRun>=2) p8+=`It also ends a run of ${brokeRun} straight nights for ${nm(L)}. `;

    if(recBig) p8+=`It's the biggest winning margin in the rivalry so far. `;
    if(recFrames) p8+=`And at ${n.frames.length} frames, it was the longest night yet. `;
    if(n.venue && atVen.length>=2) p8+=`${nm(w)}'s record at ${n.venue} now reads ${venT[w]}–${venT[L]}. `;
    if(monthN.length>=2) p8+= monT[w]>monT[L]?`${nm(w)} leads the ${monName} trophy ${monT[w]}–${monT[L]}. `: monT[w]===monT[L]?`The ${monName} trophy is level at ${monT[0]}–${monT[1]}. `:`${nm(L)} still leads the ${monName} trophy ${monT[L]}–${monT[w]}. `;

    p8+=`The bookies have ${nm(w)} at ${frac(nextW)} for next time${prior.length?` (he was ${frac(pW)} before tonight)`:''}. `;
    p8+=`${nm(L)} is on the drinks.`;
    P.push(p8.trim());
  }

  const star = w>=0 ? w : (c.pts[0]>=c.pts[1]?0:1);
  const moment = has('gb')[0]?`Golden break, ${nm(has('gb')[0].p)}` : has('c100')[0]?`Century, ${nm(has('c100')[0].p)}` : has('br')[0]||has('cb')[0]?`Break & run, ${nm((has('br')[0]||has('cb')[0]).p)}` : comeback?`${nm(w)}'s comeback` : c.best[run]>=3?`${nm(run)}'s ${c.best[run]}-frame run`:'';

function allTime(){
  const A={fr:[0,0],gw:{'9':[0,0],'8':[0,0],'s':[0,0]},hb:{v:0},nights:[0,0],draws:0,pts:[0,0],glory:[{},{}],shame:[{},{}],
    bestRun:{len:0},bigWin:{m:0},most:{f:0}};
  A.sn={pts:[0,0],brk:[[],[]],fouls:[0,0],scored:0}; A.lag=[0,0];
  NF().forEach(n=>{
    const c=calc(n), w=n.result?n.result.win:nightWinner(c);
    if(n.lag!=null) A.lag[n.lag]++;
    A.sn.scored+=c.sn.scored; [0,1].forEach(p=>{A.sn.pts[p]+=c.sn.pts[p]; A.sn.fouls[p]+=c.sn.fouls[p]; A.sn.brk[p].push(...c.sn.brk[p]);});
    A.fr[0]+=c.fw[0]; A.fr[1]+=c.fw[1];
    GAMES.forEach(g=>{A.gw[g][0]+=c.won[g][0]; A.gw[g][1]+=c.won[g][1];});
    [0,1].forEach(p=>{ if(c.hb[p]>A.hb.v) A.hb={v:c.hb[p],p,d:n.date}; });
    if(w>=0) A.nights[w]++; else A.draws++;
    A.pts[0]+=c.pts[0]; A.pts[1]+=c.pts[1];
    [0,1].forEach(p=>{
      Object.entries(c.glory[p]).forEach(([k,v])=>A.glory[p][k]=(A.glory[p][k]||0)+v);
      Object.entries(c.shame[p]).forEach(([k,v])=>A.shame[p][k]=(A.shame[p][k]||0)+v);
      if(c.best[p]>A.bestRun.len) A.bestRun={len:c.best[p],p,d:n.date};
    });
    const m=Math.abs(c.tot[0]-c.tot[1]); if(w>=0 && m>A.bigWin.m) A.bigWin={m,p:w,d:n.date,s:`${Math.max(...c.tot)}–${Math.min(...c.tot)}`};
    if(n.frames.length>A.most.f) A.most={f:n.frames.length,d:n.date};
  });
  return A;
}

/* ---------------- charts ---------------- */
const SVGNS='http://www.w3.org/2000/svg';
function drawChart(el){
  if(el.dataset.chart==='worm') drawWorm(el); else drawBars(el);
}
function drawWorm(el){
  const n=getNight(el.dataset.id); if(!n) return;
  const cn=el.dataset.cmp?getNight(el.dataset.cmp):null;
  const c=calc(n), lead=c.lead, cl=cn?calc(cn).lead:null;
  const W=el.clientWidth||340, H=226, pl=30, pr=12, pt=22, pb=40;
  const nMax=Math.max(lead.length-1, cl?cl.length-1:0, 6);
  const mx=Math.max(3, ...lead.map(Math.abs), ...(cl||[0]).map(Math.abs));
  const X=i=>pl+i*(W-pl-pr)/nMax, Y=v=>pt+(mx-v)*(H-pt-pb)/(2*mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Lead over the night, frame by frame">`;
  s+=`<rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${Y(0)-pt}" fill="#C4851A" opacity=".07"/>`;
  s+=`<rect x="${pl}" y="${Y(0)}" width="${W-pl-pr}" height="${H-pb-Y(0)}" fill="#3E8FD6" opacity=".07"/>`;
  const stepv = mx>8?4:mx>4?2:1;
  for(let v=-mx; v<=mx; v++){ if(v%stepv) continue;
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===0?'#869a8f':'#2c4a3b'}" stroke-width="1" ${v===0?'':'stroke-dasharray="2 4"'}/>`;
    s+=`<text x="${pl-6}" y="${Y(v)}" fill="#869a8f" font-size="10" text-anchor="end" dominant-baseline="middle">${v===0?'0':'+'+Math.abs(v)}</text>`;
  }
  s+=`<text x="${pl}" y="${pt-8}" fill="#c3cdc6" font-size="11" font-weight="600">▲ ${N(0)} ahead</text>`;
  s+=`<text x="${W-pr}" y="${H-6}" fill="#c3cdc6" font-size="11" font-weight="600" text-anchor="end">▼ ${N(1)} ahead</text>`;
  s+=`<text x="${pl}" y="${H-6}" fill="#869a8f" font-size="10">Frame →</text>`;
  const xstep=nMax>20?5:nMax>10?2:1;
  for(let i=xstep;i<=nMax;i+=xstep) s+=`<text x="${X(i)}" y="${H-pb+14}" fill="#869a8f" font-size="10" text-anchor="middle">${i}</text>`;
  if(cl) s+=`<path d="${cl.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v)).join(' ')}" fill="none" stroke="#869a8f" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<path d="${lead.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v)).join(' ')}" fill="none" stroke="#f3efe4" stroke-width="2" stroke-linejoin="round"/>`;
  n.frames.forEach((f,i)=>{ s+=`<circle cx="${X(i+1)}" cy="${Y(lead[i+1])}" r="${f.ch||(f.gl&&f.gl.length)?6:4.5}" fill="${f.w?'#3E8FD6':'#C4851A'}" stroke="#1a2f25" stroke-width="2"/>`; });
  s+=`<line id="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#c3cdc6" stroke-width="1" opacity="0"/>`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xh=svg.querySelector('#xh');
  const move=e=>{
    const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*(W/r.width);
    let i=Math.round((px-pl)/((W-pl-pr)/nMax)); i=Math.max(1,Math.min(nMax,i));
    const f=n.frames[i-1], cf=cn&&cn.frames[i-1];
    if(!f && !cf){ tip.style.opacity=0; xh.setAttribute('opacity',0); return; }
    xh.setAttribute('x1',X(i)); xh.setAttribute('x2',X(i)); xh.setAttribute('opacity',.5);
    const ld=v=>v===0?'Level':`${S.names[v>0?0:1]} +${Math.abs(v)}`;
    let h=`<b>Frame ${i}</b>`;
    if(f){ h+=`<span class="dot d${f.w}"></span>${esc(S.names[f.w])} won · ${GL(f.g)}${f.pts?` ${f.pts[0]}–${f.pts[1]}`:''}${f.hb?` · top breaks ${f.hb[0]} v ${f.hb[1]}`:''}<br>`;
      const bits=[...(f.gl||[]).map(k=>gdef(f.g,k).ic+' '+gdef(f.g,k).l), ...(f.sh||[]).map(k=>sdef(f.g,k).ic+' '+sdef(f.g,k).l)];
      if(f.ch) bits.unshift('⚡ Challenge frame');
      if(bits.length) h+=`<span class="muted">${bits.join(' · ')}</span><br>`;
      h+=`Lead: <b style="display:inline">${esc(ld(lead[i]))}</b>`;
      if(f.by!=null && f.by>=0) h+=`<br><span class="muted">Logged by ${esc(S.names[f.by])} · ${clock(f.t)}</span>`; }
    if(cf) h+=`<br><span class="muted">${shortDate(cn.date)}: ${esc(ld(cl[i]))}</span>`;
    tip.innerHTML=h; tip.style.opacity=1;
    const tx=(X(i)/W)*r.width; const tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(r.width-tw, tx-tw/2))+'px'; tip.style.top=(-tip.offsetHeight-6)+'px';
  };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{tip.style.opacity=0; xh.setAttribute('opacity',0);});
}
function drawBars(el){
  const nights=NF().slice(-10);
  const W=el.clientWidth||340, H=190, pl=26, pr=6, pt=10, pb=26;
  const mx=Math.max(4,...nights.map(n=>Math.max(...n.result.tot)));
  const gw=(W-pl-pr)/nights.length, bw=Math.min(22,(gw-10)/2);
  const Y=v=>pt+(mx-v)*(H-pt-pb)/mx, y0=Y(0);
  const bar=(x,v,col)=>{ const y=Y(v), h=y0-y; if(h<=0) return ''; const r=Math.min(4,h,bw/2);
    return `<path d="M${x},${y0} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${y0} Z" fill="${col}"/>`; };
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Frames won per night">`;
  const step=mx>12?4:mx>6?2:1;
  for(let v=0;v<=mx;v+=step){ s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v?'#2c4a3b':'#869a8f'}" ${v?'stroke-dasharray="2 4"':''}/><text x="${pl-6}" y="${Y(v)}" fill="#869a8f" font-size="10" text-anchor="end" dominant-baseline="middle">${v}</text>`; }
  nights.forEach((n,i)=>{
    const cx=pl+gw*i+gw/2;
    s+=bar(cx-bw-1,n.result.tot[0],'#C4851A')+bar(cx+1,n.result.tot[1],'#3E8FD6');
    s+=`<text x="${cx}" y="${H-pb+15}" fill="#869a8f" font-size="10" text-anchor="middle">${shortDate(n.date)}</text>`;
    s+=`<rect x="${pl+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent" data-i="${i}"/>`;
  });
  s+=`</svg><div class="tip"></div>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip');
  const show=e=>{
    const t=e.target.closest('rect[data-i]'); if(!t){tip.style.opacity=0;return;}
    const n=nights[+t.dataset.i], r=svg.getBoundingClientRect();
    tip.innerHTML=`<b>${fmtDate(n.date)}</b><span class="dot d0"></span>${esc(S.names[0])} ${n.result.tot[0]}<br><span class="dot d1"></span>${esc(S.names[1])} ${n.result.tot[1]}<br><span class="muted">${n.frames.length} frames · tap to open</span>`;
    tip.style.opacity=1; const cx=(pl+gw*(+t.dataset.i)+gw/2)/W*r.width, tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(r.width-tw,cx-tw/2))+'px'; tip.style.top=(-tip.offsetHeight-4)+'px';
  };
  svg.addEventListener('pointermove',show);
  svg.addEventListener('pointerleave',()=>tip.style.opacity=0);
  svg.addEventListener('click',e=>{const t=e.target.closest('rect[data-i]'); if(t){UI.view=nights[+t.dataset.i].id; UI.cmp=null; render(); window.scrollTo(0,0);}});
}

  x.textAlign='center';
  x.fillStyle='#f2c94c'; x.font='90px "Bebas Neue", Impact, sans-serif'; x.fillText('RACKUP',540,130);
  x.fillStyle='#c3cdc6'; x.font='600 36px Inter, sans-serif'; x.fillText((fmtDate(n.date)+(n.venue?'  ·  '+n.venue:'')).toUpperCase(),540,190);
  // names + score
  x.font='800 56px Inter, sans-serif';
  x.fillStyle='#C4851A'; x.fillRect(120,260,380,10); x.fillStyle='#3E8FD6'; x.fillRect(580,260,380,10);
  x.fillStyle='#f3efe4'; x.fillText(S.names[0],310,340); x.fillText(S.names[1],770,340);
  x.font='260px "Bebas Neue", Impact, sans-serif'; x.fillText(c.tot[0],310,580); x.fillText(c.tot[1],770,580);
  x.fillStyle='#869a8f'; x.font='120px "Bebas Neue", Impact, sans-serif'; x.fillText('–',540,560);
  if(w>=0){ x.fillStyle='#f2c94c'; x.font='70px sans-serif'; x.fillText('♛', w?770:310, 245); }
  x.fillStyle='#c3cdc6'; x.font='600 34px Inter, sans-serif';
  x.fillText(gamesOf(n).map(g=>`${GL(g)} ${c.sc[g][0]}–${c.sc[g][1]}`).join('   ·   ')+`   ·   ★ ${c.pts[0]} v ${c.pts[1]}`,540,650);
  // strip
  const fs=n.frames, sz=Math.min(46,Math.floor(880/Math.max(1,fs.length))-4), tw=fs.length*(sz+4)-4;
  let sx=540-tw/2; const per=Math.floor(880/(sz+4));
  fs.forEach((f,i)=>{ const row=Math.floor(i/per), col=i%per; const rx=540-Math.min(tw,per*(sz+4)-4)/2+col*(sz+4);
    x.fillStyle=f.w?'#3E8FD6':'#C4851A'; roundRect(x,rx,700+row*(sz+8),sz,sz,8); x.fill(); });
  // highlights
  const lines=[];
  if(c.best[0]>=3||c.best[1]>=3){ const p=c.best[0]>=c.best[1]?0:1; lines.push(`🔥 ${S.names[p]}: ${c.best[p]} on the bounce`); }
  n.frames.forEach(f=>(f.gl||[]).forEach(k=>{const d=gdef(f.g,k); if(d.p>=2) lines.push(`${d.ic} ${d.l}: ${S.names[f.w]}`);}));
  const sh=[]; n.frames.forEach(f=>(f.sh||[]).forEach(k=>sh.push(`${sdef(f.g,k).ic} ${sdef(f.g,k).l}: ${S.names[1-f.w]}`)));
  if(c.hb[0]>=20||c.hb[1]>=20){ const p=c.hb[0]>=c.hb[1]?0:1; lines.unshift(`🔴 High break: ${c.hb[p]} by ${S.names[p]}`); }
  if(sh.length) lines.push('SHAME · '+sh[sh.length-1]);
  if(n.rate) lines.push(`⭐ Self-rated: ${S.names[0]} ${n.rate[0]||'–'}/10 · ${S.names[1]} ${n.rate[1]||'–'}/10`);
  x.font='600 38px Inter, sans-serif'; x.fillStyle='#f3efe4';
  lines.slice(0,6).forEach((l,i)=>x.fillText(l,540,900+i*62));
  x.fillStyle='#f2c94c'; x.font='800 42px Inter, sans-serif';
  x.fillText(w>=0?`🍺 ${S.names[1-w]} buys the round`:'🍺 All square tonight',540,1270);
  const url=cv.toDataURL('image/png');
  // try native share (works when hosted on GitHub), else show image to long-press save
  try{
    const blob=await (await fetch(url)).blob();
    const file=new File([blob],'rackup.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'RackUp'}); return; }
  }catch(e){}
  document.getElementById('sheet').innerHTML=`<h2>📸 Share card</h2><div class="muted" style="font-size:13px;margin-bottom:10px">Long-press the image to save it or share to WhatsApp.</div><img class="shareimg" src="${url}" alt="Night summary card"><button class="btn block mt" data-act="close" style="margin-top:12px">Done</button>`;
  document.getElementById('ov').classList.add('show');
}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, d=b.dataset;
  if(a!=='end') UI.endArm=false;
  if(a!=='reset') UI.resetArm=false;
  if(a!=='delnight') UI.delArm=false;
  switch(a){
    case 'tab': UI.tab=d.t; UI.view=null; UI.cmp=null; render(); window.scrollTo(0,0); break;
    case 'st': { const u=UI.setup, dv=+d.d;
      const pr=d.k.split('_');
      if(pr[0]==='m') u.mins[pr[1]]=Math.max(0,Math.min(360,Math.round((u.mins[pr[1]]||0)/15)*15+dv*15));
      else if(pr[0]==='r') u.race[pr[1]]=Math.max(0,Math.min(25,u.race[pr[1]]+dv));
      else u.h[pr[1]][+pr[2]]=Math.max(0,Math.min(5,u.h[pr[1]][+pr[2]]+dv));
      render(); break; }
    case 'start': startNight(); break;
    case 'pickv': UI.setup.venue=d.v; render(); break;
    case 'addv': UI.addV=!UI.addV; render(); if(UI.addV) setTimeout(()=>{const i=document.getElementById('newv'); if(i) i.focus();},50); break;
    case 'savev': { const v=(document.getElementById('newv').value||'').trim(); if(v){ if(!S.venues.includes(v)) S.venues.push(v); UI.setup.venue=v; save(); } UI.addV=false; render(); break; }
    case 'delv': S.venues.splice(+d.i,1); save(); render(); break;
    case 'vfilter': UI.venue=d.v||null; UI.view=null; render(); break;
    case 'pickfirst': UI.setup.first=+d.p; UI.setup.lag=+d.p; UI.setup.tossed=false; render(); break;
    case 'toss': { const p=Math.random()<0.5?0:1; UI.setup.first=p; UI.setup.lag=null; UI.setup.tossed=true; render(); toast('🪙 '+S.names[p].toUpperCase(), 'Breaks first'); break; }
    case 'rule': UI.setup.rule[d.g]=d.r; render(); break;
    case 'swapbo': { const n=S.cur; n.bov=n.bov||{}; n.bov[d.g]=1-nextBreaker(n,d.g); save(); render(); break; }
    case 'pot': snkShot({t:'pot', b:+d.b}); break;
    case 'smiss': snkShot({t:'miss'}); break;
    case 'sturn': { const st=snkState(snkInit(S.cur)); if(+d.p!==st.turn){ if(!snkInit(S.cur).shots.length){ S.cur.snk.first=+d.p; save(); render(); } else snkShot({t:'miss'}); } break; }
    case 'sfoul': UI.foul=!UI.foul; render(); break;
    case 'sfv': snkShot({t:'foul', v:+d.v}); break;
    case 'sback': snkShot({t:'back'}); break;
    case 'sfree': snkShot({t:'free'}); break;
    case 'sredoff': snkShot({t:'redoff'}); break;
    case 'sundo': { const sn=snkInit(S.cur); sn.shots.pop(); UI.foul=false; UI.what='undid a snooker shot'; save(); render(); break; }
    case 'sreds': { const sn=snkInit(S.cur); sn.reds=+d.r; S.set.reds=+d.r; save(); render(); break; }
    case 'sover': snkOver(); break;
    case 'pickg': { const u=UI.setup; u.games = u.games.includes(d.g) ? u.games.filter(x=>x!==d.g) : [...u.games, d.g]; render(); break; }
    case 'game': S.cur.g=d.g; S.cur.allDone=false; save(); render(); break;
    case 'moveup': { const u=UI.setup, i=u.games.indexOf(d.g); if(i>0){ [u.games[i-1],u.games[i]]=[u.games[i],u.games[i-1]]; } render(); break; }
    case 'startgame': { const G=S.cur.games[S.cur.g]; G.t0=Date.now(); G.done=false; UI.what=`started the ${GL(S.cur.g).toLowerCase()}`; save(); render(); toast(`${GL(S.cur.g).toUpperCase()} · GAME ON`, G.mins?`${minsLbl(G.mins)} on the clock`:'No time limit','tick'); break; }
    case 'finishgame': { const n=S.cur, g=n.g, G=n.games[g], c=calc(n); G.done=true; G.t1=Date.now(); UI.what=`finished the ${GL(g).toLowerCase()} (${c.sc[g][0]}–${c.sc[g][1]})`;
      const gl=gamesOf(n), nx=gl.slice(gl.indexOf(g)+1).find(x=>!n.games[x].done);
      if(nx) n.g=nx; else n.allDone=true;
      save(); render(); window.scrollTo(0,0);
      const w=c.sc[g][0]===c.sc[g][1]?-1:(c.sc[g][0]>c.sc[g][1]?0:1);
      toast(`${GL(g).toUpperCase()} DONE`, w<0?`All square ${c.sc[g][0]}–${c.sc[g][1]}`:`${S.names[w]} wins it ${Math.max(...c.sc[g])}–${Math.min(...c.sc[g])}`); break; }
    case 'reopen': { const G=S.cur.games[S.cur.g]; G.done=false; S.cur.allDone=false; save(); render(); break; }
    case 'addtime': { const G=S.cur.games[S.cur.g]; G.extra=(G.extra||0)+10; G.tup=false; save(); render(); break; }
    case 'award': openAward(+d.w); break;
    case 'tgl': UI.sel.gl.has(d.k)?UI.sel.gl.delete(d.k):UI.sel.gl.add(d.k); drawAward(); break;
    case 'tsh': UI.sel.sh.has(d.k)?UI.sel.sh.delete(d.k):UI.sel.sh.add(d.k); drawAward(); break;
    case 'log': logFrame(); break;
    case 'close': closeSheet(); break;
    case 'undo': undo(); break;
    case 'rate': UI.rate.r[+d.p]= UI.rate.r[+d.p]===+d.v?0:+d.v; drawRate(); break;
    case 'ratesave': case 'rateskip': { const u=UI.rate, n=getNight(u.id);
      if(a==='ratesave' && (u.r[0]||u.r[1])) n.rate=[u.r[0],u.r[1]];
      UI.rate=null; closeSheet(); save(); if(u.ending) endNight(); else render(); break; }
    case 'rateedit': openRate(d.id,false); break;
    case 'end': if(UI.endArm){UI.endArm=false; if(S.cur.frames.length) openRate('cur',true); else endNight();} else {UI.endArm=true; render(); setTimeout(()=>{if(UI.endArm){UI.endArm=false;render();}},3500);} break;
    case 'open': UI.view=d.id; UI.cmp=null; render(); window.scrollTo(0,0); break;
    case 'back': UI.view=null; UI.cmp=null; render(); break;
    case 'share': shareCard(d.id); break;
    case 'archall': UI.archAll=!UI.archAll; render(); break;
    case 'copyreport': { const r=paperOf(getNight(d.id)); const txt=`📰 *${r.hl}*\n_${r.sub}_\n\n${r.P.join('\n\n')}\n\n⭐ Star man: ${S.names[r.star]}${r.moment?`\n🎱 Moment of the night: ${r.moment}`:''}`;
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>snack('📋 Report copied. Paste it into WhatsApp')).catch(()=>snack('Couldn\'t copy on this phone')); break; }
    case 'tbl': UI.table=!UI.table; render(); break;
    case 'paid': if(S.owed[+d.p]>0){S.owed[+d.p]--; save(); render();} break;
    case 'opt': S.set[d.k]=!S.set[d.k]; save(); render(); break;
    case 'delnight': if(UI.delArm){ S.nights=S.nights.filter(n=>n.id!==d.id); UI.delArm=false; UI.view=null; save(); render(); } else { UI.delArm=true; render(); } break;
    case 'copy': { const txt=JSON.stringify(S); const m=document.getElementById('bkmsg');
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>m.textContent='Copied. Paste it somewhere safe.')
        .catch(()=>{document.getElementById('imp').value=txt; m.textContent='Couldn\'t copy automatically. It\'s in the box above, so select it and copy.';}); break; }
    case 'signout': if(CLOUD.signOut) CLOUD.signOut(); break;
    case 'import': { const m=document.getElementById('bkmsg');
      try{ const o=JSON.parse(document.getElementById('imp').value); if(!o||!Array.isArray(o.nights)) throw 0; S=o; save(); m.textContent='Imported.'; render(); }catch(err){ m.textContent='That doesn\'t look like a RackUp backup.'; } break; }
    case 'reset': if(!UI.resetArm){ UI.resetArm=true; render(); break; }
      UI.resetArm=false;
      if(CLOUD.user){ S.resetReq={by:meIdx(), email:CLOUD.user.email||'', at:Date.now()}; save(); render(); toast('REQUEST SENT', 'Waiting for the other player to agree','tick'); }
      else doWipe();
      break;
    case 'resetcancel': delete S.resetReq; save(); render(); break;
    case 'resetno': delete S.resetReq; save(); render(); toast('RESET BLOCKED','The history stays','tick'); break;
    case 'resetyes': delete S.resetReq; doWipe(); toast('ALL RESET','Fresh start. Backup kept','tick'); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='name'){ S.names[+t.dataset.p]=t.value.trim()||(t.dataset.p==='0'?'Player 1':'Player 2'); UI.setup=null; save(); render(); }
  if(t.dataset.act==='cmp'){ UI.cmp=t.value; render(); }
});
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov' ) closeSheet(); });
window.addEventListener('resize',()=>document.querySelectorAll('[data-chart]').forEach(drawChart));
render();
cloudInit();
setInterval(()=>{
  const n=S.cur; if(!n || UI.tab!=='night' || !n.games[n.g]) return;
  const G=n.games[n.g]; if(!G.t0 || G.done || n.allDone) return;
  const left=timeLeft(G);
  if(left==null){ const el=document.getElementById('tmr'); if(el) el.textContent=fmtLeft(Date.now()-G.t0)+' played'; return; }
  if(left<=0 && !G.tup){ G.tup=true; save(); const gl=gamesOf(n), nx=gl[gl.indexOf(n.g)+1];
    if(!document.getElementById('ov').classList.contains('show')) render();
    toast("TIME'S UP", nx?`Finish the frame, then on to ${GL(nx).toLowerCase()}`:'Finish the frame and call it a night','bad'); return; }
  const el=document.getElementById('tmr'), fl=document.getElementById('tmrfill');
  if(el && left>0){ el.textContent=fmtLeft(left)+' left'; const tot=(G.mins+(G.extra||0))*60000, pct=Math.max(0,left/tot*100); fl.style.width=pct+'%'; fl.style.background=pct<15?'var(--bad)':'var(--gold)'; }
},1000);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
